# Serves the built slicer. Home Assistant Ingress strips its /api/hassio_ingress/<token>/
# prefix before proxying, and the site uses relative asset URLs, so no rewriting is needed.
server {
    listen 8099;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Allow the page to run its slicing Web Worker and WebGL; nothing is loaded from other hosts.
    add_header X-Content-Type-Options nosniff always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        # Vite emits content-hashed filenames, safe to cache for a long time.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Printer relay -------------------------------------------------------
    # The browser cannot call a plain-HTTP printer from an HTTPS page and the
    # printer does not answer CORS preflights, so the app posts to
    #   /printer/<ip>[:port]/<path>   and nginx forwards to   http://<ip>:<port>/<path>
    # Only private LAN addresses are accepted, so this is not an open proxy.
    location = /relay-status {
        add_header X-Printer-Relay 1 always;
        add_header X-Settings-Store 1 always;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # ---- Settings store ---------------------------------------------------------
    # The app keeps its settings (presets, overrides, saved printer) in /data so
    # every device that opens this server shares them. Plain GET/PUT of one JSON file.
    location = /settings.json {
        alias /data/settings.json;
        dav_methods PUT;
        dav_access user:rw group:rw all:r;
        create_full_put_path on;
        client_body_temp_path /data/.tmp;
        client_max_body_size 1m;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    # Anything under /printer/ that is not a private LAN address is refused.
    location /printer/ {
        return 403 "relay: only private LAN addresses are allowed\n";
    }
    location ~ "^/printer/(?<phost>(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}))(:(?<pport>\d+))?/(?<ppath>.*)$" {
        set $pp 8898;
        if ($pport != "") { set $pp $pport; }
        client_max_body_size 2048m;
        proxy_http_version 1.1;
        proxy_pass http://$phost:$pp/$ppath$is_args$args;
        proxy_set_header Host $phost:$pp;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        # Buffer the upload fully so the printer receives a plain Content-Length body.
        proxy_request_buffering on;
        proxy_buffering off;
    }
}
