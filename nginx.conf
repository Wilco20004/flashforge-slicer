# Serves the built slicer. Home Assistant Ingress strips its /api/hassio_ingress/<token>/
# prefix before proxying, and the site uses relative asset URLs, so no rewriting is needed.
server {
    listen 8099;
    listen [::]:8099;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Allow the page to run its slicing Web Worker and WebGL; nothing is loaded from other hosts.
    add_header X-Content-Type-Options nosniff always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        # Vite emits content-hashed filenames, safe to cache for a long time.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
